<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ant Colony</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a110b; }
  body { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; color: #ecd7b6; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  #stats { position: fixed; top: 14px; left: 16px; display: flex; gap: 10px; pointer-events: none; }
  .pill { background: rgba(28, 18, 11, .72); border: 1px solid rgba(240, 190, 120, .14); border-radius: 999px; padding: 6px 12px; font-size: 13px; letter-spacing: .02em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .pill b { color: #ffc56b; font-weight: 650; font-variant-numeric: tabular-nums; }
  #ui { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: rgba(28, 18, 11, .8); border: 1px solid rgba(240, 190, 120, .16); border-radius: 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0, 0, 0, .45); }
  #ui .sep { width: 1px; background: rgba(240, 190, 120, .14); margin: 6px 2px; }
  button { appearance: none; border: 0; background: transparent; color: #d9c1a0; font: inherit; font-size: 12px; min-width: 50px; padding: 6px 8px 5px; border-radius: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: manipulation; }
  button .ic { width: 20px; height: 20px; } button .ic svg { width: 20px; height: 20px; display: block; }
  button:hover { background: rgba(255, 210, 150, .07); }
  button.on { background: linear-gradient(#5a3a20, #47301c); color: #ffe2b3; box-shadow: inset 0 0 0 1px rgba(255, 190, 110, .35); }
  #hint { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); pointer-events: none; font-size: 14px; color: #f0dcbc; background: rgba(28, 18, 11, .72); border: 1px solid rgba(240, 190, 120, .14); padding: 8px 14px; border-radius: 12px; transition: opacity .8s; white-space: nowrap; }
  @media (max-width: 480px) { button { min-width: 40px; padding: 5px 4px; font-size: 10px; } button .ic, button .ic svg { width: 17px; height: 17px; } #hint { font-size: 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  <div class="pill">Food stored <b id="stored">0</b></div>
  <div class="pill">Ants out <b id="out">0</b></div>
</div>
<div id="hint">Drag to drop food · walls and eraser below</div>
<div id="ui">
  <button data-tool="food" class="on" title="Drop food (1)"><span class="ic"><svg viewBox="0 0 20 20"><circle cx="7" cy="12" r="3" fill="#f2b75a"/><circle cx="12.5" cy="8" r="2.6" fill="#e39a3e"/><circle cx="13" cy="13.5" r="2.2" fill="#ffd27a"/></svg></span>Food</button>
  <button data-tool="wall" title="Place walls (2)"><span class="ic"><svg viewBox="0 0 20 20"><path d="M3 15l2.5-6 4-3 5 1.5 2.5 5-1.5 3.5H5z" fill="#6f5c4c" stroke="#9a8571" stroke-width="1"/></svg></span>Wall</button>
  <button data-tool="erase" title="Erase (3)"><span class="ic"><svg viewBox="0 0 20 20"><path d="M4 13l7-7 5 5-5 5H8z" fill="none" stroke="#e7b3a0" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9.5l5 5" stroke="#e7b3a0" stroke-width="1.6"/></svg></span>Erase</button>
  <div class="sep"></div>
  <button id="brush" title="Brush size (B)"><span class="ic"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="none" stroke="#d9c1a0" stroke-width="1.6" stroke-dasharray="2 2"/></svg></span><span id="brushLbl">Medium</span></button>
  <button id="speed" title="Speed (F)"><span class="ic"><svg viewBox="0 0 20 20"><path d="M3 5l6 5-6 5zM10 5l6 5-6 5z" fill="#d9c1a0"/></svg></span><span id="speedLbl">1×</span></button>
  <button id="pause" title="Pause (Space)"><span class="ic" id="pauseIc"><svg viewBox="0 0 20 20"><rect x="5" y="4" width="3.2" height="12" rx="1" fill="#d9c1a0"/><rect x="11.8" y="4" width="3.2" height="12" rx="1" fill="#d9c1a0"/></svg></span><span id="pauseLbl">Pause</span></button>
  <button id="reset" title="New colony (R)"><span class="ic"><svg viewBox="0 0 20 20"><path d="M5.5 7A6 6 0 1 1 4 11" fill="none" stroke="#d9c1a0" stroke-width="1.7" stroke-linecap="round"/><path d="M3 4v4h4" fill="none" stroke="#d9c1a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Reset</button>
</div>
<script>
'use strict';
// ===================== Main settings =====================
const SETTINGS = {
  cell: 4,              // px per grid cell (pheromone / food / wall resolution)
  antDensity: 1 / 3200, // ants per px² of screen…
  antMin: 140,          // …clamped to this range
  antMax: 520,
  releaseRate: 40,      // ants leaving the nest per second at start
  antSpeed: 52,         // px per second
  senseDist: 14,        // px ahead the antennae sample
  senseAngle: 0.6,      // radians left/right of heading
  turn: 0.32,           // radians per step when steering toward a scent
  wander: 0.28,         // random heading jitter per step
  homeBias: 0.035,      // how strongly loaded ants remember the nest direction
  trailLife: 28,        // seconds an ant keeps laying a useful trail after an event
  foodHalfLife: 7,      // seconds for a food trail to fade to half
  homeHalfLife: 9,      // seconds for a home trail to fade to half
  foodPerCell: 4,       // crumbs per food cell
  nestRadius: 20,       // px
  brushSizes: [10, 20, 36],
  speeds: [1, 2, 4],
};
// =========================================================

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const C = SETTINGS.cell;

let W = 0, H = 0, GW = 0, GH = 0;
let toFood, toHome, food, wall;            // grids
let soilCv, matterCv, mctx, pheroCv, pctx, pheroImg, glowCv, gctx;
let nest = { x: 0, y: 0 };
let N = 0, released = 0, stored = 0, nestPulse = 0;
let ax, ay, aa, ac, at, aw;                // ant arrays: x, y, angle, carrying, time since event, walk phase
let tool = 'food', brushIdx = 1, speedIdx = 0, paused = false;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rnd(a = 1, b) { return b === undefined ? Math.random() * a : a + Math.random() * (b - a); }
function hash(i) { i = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); i ^= i >>> 13; i = Math.imul(i, 0xc2b2ae35); return ((i ^ (i >>> 16)) >>> 0) / 4294967296; }

// ---------- world setup ----------
function setup(fresh) {
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  GW = Math.ceil(W / C); GH = Math.ceil(H / C);
  const n = GW * GH;
  toFood = new Float32Array(n); toHome = new Float32Array(n);
  food = new Uint8Array(n); wall = new Uint8Array(n);
  matterCv = mk(cv.width, cv.height); mctx = matterCv.getContext('2d'); mctx.scale(DPR, DPR);
  pheroCv = mk(GW, GH); pctx = pheroCv.getContext('2d'); pheroImg = pctx.createImageData(GW, GH);
  glowCv = mk(Math.ceil(GW / 3), Math.ceil(GH / 3)); gctx = glowCv.getContext('2d');
  buildSoil();
  nest.x = W * (W > H ? 0.3 : 0.5); nest.y = H * (W > H ? 0.55 : 0.62);
  N = Math.round(Math.min(SETTINGS.antMax, Math.max(SETTINGS.antMin, W * H * SETTINGS.antDensity)));
  ax = new Float32Array(N); ay = new Float32Array(N); aa = new Float32Array(N);
  ac = new Uint8Array(N); at = new Float32Array(N); aw = new Float32Array(N);
  for (let i = 0; i < N; i++) { ax[i] = nest.x; ay[i] = nest.y; aa[i] = rnd(Math.PI * 2); aw[i] = rnd(10); }
  released = 0; stored = 0;
  if (fresh) startingScene();
}

function startingScene() {
  const s = Math.min(W, H);
  if (W > H) {
    paintCircle('food', W * 0.76, H * 0.3, s * 0.07);
    paintCircle('food', W * 0.7, H * 0.8, s * 0.055);
    // a curved rock ridge between the nest and the upper pile
    for (let t = 0; t <= 1; t += 0.02) paintCircle('wall', W * (0.52 + 0.04 * Math.sin(t * 3)), H * (0.2 + t * 0.32), 9);
  } else {
    paintCircle('food', W * 0.3, H * 0.22, s * 0.11);
    paintCircle('food', W * 0.78, H * 0.38, s * 0.08);
    for (let t = 0; t <= 1; t += 0.02) paintCircle('wall', W * (0.35 + t * 0.35), H * (0.42 + 0.02 * Math.sin(t * 4)), 8);
  }
}

function buildSoil() {
  soilCv = mk(cv.width, cv.height);
  const s = soilCv.getContext('2d'); s.scale(DPR, DPR);
  const g = s.createRadialGradient(W * 0.45, H * 0.5, 0, W * 0.5, H * 0.5, Math.hypot(W, H) * 0.65);
  g.addColorStop(0, '#2c1d12'); g.addColorStop(0.6, '#20150d'); g.addColorStop(1, '#130c07');
  s.fillStyle = g; s.fillRect(0, 0, W, H);
  // soft clay blotches
  for (let i = 0; i < (W * H) / 9000; i++) {
    const x = rnd(W), y = rnd(H), r = rnd(30, 120);
    const b = s.createRadialGradient(x, y, 0, x, y, r);
    const hue = rnd(18, 34), l = rnd(10, 17);
    b.addColorStop(0, `hsla(${hue},40%,${l}%,0.35)`); b.addColorStop(1, `hsla(${hue},40%,${l}%,0)`);
    s.fillStyle = b; s.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // grain speckles
  for (let i = 0; i < (W * H) / 60; i++) {
    const l = rnd(6, 26);
    s.fillStyle = `hsla(${rnd(15, 40)},${rnd(20, 45)}%,${l}%,${rnd(0.25, 0.7)})`;
    const r = rnd(0.4, 1.3); s.fillRect(rnd(W), rnd(H), r, r);
  }
  // pebbles
  for (let i = 0; i < (W * H) / 14000; i++) {
    const x = rnd(W), y = rnd(H), r = rnd(1.2, 3.6), l = rnd(18, 32);
    s.fillStyle = 'rgba(0,0,0,.35)'; s.beginPath(); s.ellipse(x + 0.8, y + 1, r, r * 0.8, 0, 0, 7); s.fill();
    s.fillStyle = `hsl(${rnd(20, 40)},${rnd(12, 25)}%,${l}%)`; s.beginPath(); s.ellipse(x, y, r, r * 0.8, rnd(3), 0, 7); s.fill();
  }
}

// ---------- painting ----------
const inNest = (x, y, pad) => (x - nest.x) ** 2 + (y - nest.y) ** 2 < (SETTINGS.nestRadius + pad) ** 2;

function drawCrumbs(cx, cy, idx) {
  // a few honey/seed crumbs inside one cell
  for (let k = 0; k < 2; k++) {
    const h = hash(idx * 7 + k);
    const hue = 22 + h * 24, l = 40 + hash(idx * 13 + k) * 22;
    mctx.fillStyle = `hsl(${hue},${55 + h * 30}%,${l}%)`;
    mctx.beginPath(); mctx.arc(cx + hash(idx + k * 31) * C, cy + hash(idx * 3 + k) * C, 1.1 + h * 1.4, 0, 7); mctx.fill();
  }
}

function paintCircle(kind, x, y, r) {
  const g0 = Math.max(0, Math.floor((x - r) / C)), g1 = Math.min(GW - 1, Math.floor((x + r) / C));
  const h0 = Math.max(0, Math.floor((y - r) / C)), h1 = Math.min(GH - 1, Math.floor((y + r) / C));
  if (kind === 'wall') {
    // stone blob on the matter layer
    mctx.globalCompositeOperation = 'source-over';
    mctx.fillStyle = '#4f4036'; mctx.beginPath(); mctx.arc(x, y, r, 0, 7); mctx.fill();
    mctx.save(); mctx.clip();
    for (let k = 0, n = r * r * 0.12; k < n; k++) {
      const a = rnd(7), d = Math.sqrt(Math.random()) * r, l = rnd(24, 44);
      mctx.fillStyle = `hsla(${rnd(18, 36)},${rnd(8, 22)}%,${l}%,${rnd(0.4, 0.9)})`;
      mctx.beginPath(); mctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rnd(0.6, 2.4), 0, 7); mctx.fill();
    }
    mctx.restore();
  } else if (kind === 'erase') {
    mctx.globalCompositeOperation = 'destination-out';
    mctx.beginPath(); mctx.arc(x, y, r, 0, 7); mctx.fill();
    mctx.globalCompositeOperation = 'source-over';
  }
  for (let gy = h0; gy <= h1; gy++) for (let gx = g0; gx <= g1; gx++) {
    const cx = gx * C + C / 2, cy = gy * C + C / 2;
    if ((cx - x) ** 2 + (cy - y) ** 2 > r * r) continue;
    const i = gy * GW + gx;
    if (kind === 'food') {
      if (wall[i] || food[i] || inNest(cx, cy, 10)) continue;
      food[i] = SETTINGS.foodPerCell; drawCrumbs(gx * C, gy * C, i);
    } else if (kind === 'wall') {
      if (inNest(cx, cy, 6)) continue;
      wall[i] = 1; food[i] = 0; toFood[i] = 0; toHome[i] = 0;
    } else {
      wall[i] = 0; food[i] = 0; toFood[i] = 0; toHome[i] = 0;
    }
  }
  // keep the nest clear of stone
  if (kind === 'wall' && inNest(x, y, r + 4)) {
    mctx.globalCompositeOperation = 'destination-out';
    mctx.beginPath(); mctx.arc(nest.x, nest.y, SETTINGS.nestRadius + 6, 0, 7); mctx.fill();
    mctx.globalCompositeOperation = 'source-over';
  }
}

function paintStroke(kind, x0, y0, x1, y1, r) {
  const d = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(d / (r * 0.35)));
  for (let s = 1; s <= steps; s++) paintCircle(kind, x0 + (x1 - x0) * s / steps, y0 + (y1 - y0) * s / steps, r);
}

// ---------- simulation ----------
function cellAt(x, y) { const gx = x / C | 0, gy = y / C | 0; return (gx < 0 || gy < 0 || gx >= GW || gy >= GH) ? -1 : gy * GW + gx; }

function sense(x, y, carrying) {
  const gx = x / C | 0, gy = y / C | 0;
  if (gx < 1 || gy < 1 || gx >= GW - 1 || gy >= GH - 1) return -1;
  const f = carrying ? toHome : toFood;
  let v = 0;
  for (let oy = -1; oy <= 1; oy++) {
    const row = (gy + oy) * GW;
    for (let ox = -1; ox <= 1; ox++) {
      const i = row + gx + ox;
      if (wall[i]) return -1;
      v += f[i];
      if (!carrying && food[i]) v += 4;
    }
  }
  if (carrying && inNest(x, y, 24)) v += 20;
  return v;
}

function step(dt) {
  const ef = Math.pow(0.5, dt / SETTINGS.foodHalfLife), eh = Math.pow(0.5, dt / SETTINGS.homeHalfLife);
  for (let i = 0, n = toFood.length; i < n; i++) { toFood[i] *= ef; toHome[i] *= eh; }

  released = Math.min(N, released + SETTINGS.releaseRate * dt);
  const nAct = released | 0, d = SETTINGS.antSpeed * dt, SA = SETTINGS.senseAngle, SD = SETTINGS.senseDist;
  const nr2 = SETTINGS.nestRadius ** 2;
  for (let i = 0; i < nAct; i++) {
    let x = ax[i], y = ay[i], a = aa[i];
    const carry = ac[i];
    // antennae: left, centre, right
    const l = sense(x + Math.cos(a - SA) * SD, y + Math.sin(a - SA) * SD, carry);
    const c = sense(x + Math.cos(a) * SD, y + Math.sin(a) * SD, carry);
    const r = sense(x + Math.cos(a + SA) * SD, y + Math.sin(a + SA) * SD, carry);
    if (Math.max(l, c, r) > 0.02) {
      if (c < l || c < r) a += l > r ? -SETTINGS.turn : SETTINGS.turn;
    } else if (l < 0 && r >= 0) a += SETTINGS.turn;   // wall on the left
    else if (r < 0 && l >= 0) a -= SETTINGS.turn;     // wall on the right
    if (carry) {
      // path integration: loaded ants remember roughly where home is
      const want = Math.atan2(nest.y - y, nest.x - x);
      let dA = want - a; dA = Math.atan2(Math.sin(dA), Math.cos(dA));
      a += dA * SETTINGS.homeBias * (1 + at[i] / 10);
    }
    a += (Math.random() - 0.5) * SETTINGS.wander;

    const nx = x + Math.cos(a) * d, ny = y + Math.sin(a) * d;
    const ci = cellAt(x, y), ni = cellAt(nx, ny);
    if (ni < 0 || (wall[ni] && !(ci >= 0 && wall[ci]))) {
      a += Math.PI + (Math.random() - 0.5) * 1.6;
    } else {
      x = nx; y = ny; aw[i] += d * 0.9;
    }
    at[i] += dt;
    const idx = cellAt(x, y);
    if (idx >= 0) {
      const s = Math.max(0, 1 - at[i] / SETTINGS.trailLife);
      if (carry) { if (toFood[idx] < s) toFood[idx] = s; }
      else if (toHome[idx] < s) toHome[idx] = s;
      if (!carry && food[idx]) {
        if (--food[idx] === 0) { const gx = idx % GW, gy = idx / GW | 0; mctx.clearRect(gx * C - 1, gy * C - 1, C + 2, C + 2); }
        ac[i] = 1; at[i] = 0; a += Math.PI;
      }
    }
    const dn = (x - nest.x) ** 2 + (y - nest.y) ** 2;
    if (dn < nr2) {
      if (carry) { ac[i] = 0; stored++; nestPulse = 1; a += Math.PI; }
      at[i] = 0;
    }
    ax[i] = x; ay[i] = y; aa[i] = a;
  }
}

// ---------- rendering ----------
function renderPheromones() {
  const p = pheroImg.data;
  for (let i = 0, j = 0, n = toFood.length; i < n; i++, j += 4) {
    const f = Math.min(1, toFood[i]), h = Math.min(1, toHome[i]) * 0.5;
    // food trail: amber glow · home trail: dusty rose
    p[j] = 240 * f + 170 * h; p[j + 1] = 128 * f + 100 * h; p[j + 2] = 44 * f + 112 * h;
    p[j + 3] = Math.min(255, (f * 0.42 + h * 0.3) * 255);
  }
  pctx.putImageData(pheroImg, 0, 0);
  gctx.clearRect(0, 0, glowCv.width, glowCv.height);
  gctx.drawImage(pheroCv, 0, 0, glowCv.width, glowCv.height);
}

function drawNest(t) {
  const R = SETTINGS.nestRadius, x = nest.x, y = nest.y;
  const g = ctx.createRadialGradient(x, y, R * 0.3, x, y, R * 2.4);
  g.addColorStop(0, 'rgba(160,104,58,.55)'); g.addColorStop(0.5, 'rgba(120,76,40,.32)'); g.addColorStop(1, 'rgba(90,56,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 2.4, 0, 7); ctx.fill();
  // mound grains
  for (let k = 0; k < 26; k++) {
    const ang = hash(k) * 7, rr = R * (0.7 + hash(k + 50) * 0.9);
    ctx.fillStyle = `hsl(${24 + hash(k + 9) * 14},${35 + hash(k + 3) * 20}%,${26 + hash(k + 7) * 16}%)`;
    ctx.beginPath(); ctx.arc(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr, 1.5 + hash(k + 21) * 2.2, 0, 7); ctx.fill();
  }
  const pulse = nestPulse;
  ctx.strokeStyle = `rgba(255,196,110,${0.12 + pulse * 0.45})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, R + 3 + pulse * 5 + Math.sin(t * 2) * 0.8, 0, 7); ctx.stroke();
  const hole = ctx.createRadialGradient(x, y, 0, x, y, R * 0.65);
  hole.addColorStop(0, '#050302'); hole.addColorStop(1, 'rgba(5,3,2,0)');
  ctx.fillStyle = hole; ctx.beginPath(); ctx.arc(x, y, R * 0.65, 0, 7); ctx.fill();
}

const ANT_COLS = ['#d08445', '#bb6d38', '#e0995a'];
function drawAnts() {
  const nAct = released | 0;
  ctx.lineCap = 'round';
  // legs
  ctx.strokeStyle = 'rgba(70,38,20,.9)'; ctx.lineWidth = 0.7; ctx.beginPath();
  for (let i = 0; i < nAct; i++) {
    const x = ax[i], y = ay[i], a = aa[i], cs = Math.cos(a), sn = Math.sin(a);
    const sw = Math.sin(aw[i]) * 1.2;
    for (let k = -1; k <= 1; k++) {
      const bx = x + cs * k * 1.4, by = y + sn * k * 1.4, o = (k === 0 ? sw : -sw);
      ctx.moveTo(bx - sn * 3 + cs * o, by + cs * 3 + sn * o); ctx.lineTo(bx + sn * 3 - cs * o, by - cs * 3 - sn * o);
    }
  }
  ctx.stroke();
  for (let g = 0; g < 3; g++) {
    ctx.strokeStyle = ANT_COLS[g];
    // abdomen + thorax
    ctx.lineWidth = 2.7; ctx.beginPath();
    for (let i = g; i < nAct; i += 3) {
      const cs = Math.cos(aa[i]), sn = Math.sin(aa[i]);
      ctx.moveTo(ax[i] - cs * 3.2, ay[i] - sn * 3.2); ctx.lineTo(ax[i] + cs * 0.8, ay[i] + sn * 0.8);
    }
    ctx.stroke();
    // head
    ctx.lineWidth = 2; ctx.beginPath();
    for (let i = g; i < nAct; i += 3) {
      const cs = Math.cos(aa[i]), sn = Math.sin(aa[i]);
      ctx.moveTo(ax[i] + cs * 2.4, ay[i] + sn * 2.4); ctx.lineTo(ax[i] + cs * 3.1, ay[i] + sn * 3.1);
    }
    ctx.stroke();
  }
  // carried crumbs
  ctx.fillStyle = '#ffd27a'; ctx.beginPath();
  for (let i = 0; i < nAct; i++) if (ac[i]) {
    const x = ax[i] + Math.cos(aa[i]) * 4.6, y = ay[i] + Math.sin(aa[i]) * 4.6;
    ctx.moveTo(x + 1.6, y); ctx.arc(x, y, 1.6, 0, 7);
  }
  ctx.fill();
}

let tStep = 0, tRender = 0;
function render(t) {
  const t0 = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(soilCv, 0, 0);
  renderPheromones();
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.7; ctx.drawImage(glowCv, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.45; ctx.drawImage(pheroCv, 0, 0, GW * C * DPR, GH * C * DPR);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(matterCv, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawNest(t);
  drawAnts();
  if (hover && !drawing) {
    ctx.strokeStyle = tool === 'erase' ? 'rgba(255,140,120,.55)' : tool === 'wall' ? 'rgba(220,200,180,.5)' : 'rgba(255,200,110,.55)';
    ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(hover.x, hover.y, SETTINGS.brushSizes[brushIdx], 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  tRender = tRender * 0.95 + (performance.now() - t0) * 0.05;
}

// ---------- loop ----------
let last = performance.now(), acc = 0, hudT = 0, fpsT = 0, frames = 0, fps = 60;
const DT = 1 / 60;
function frame(now) {
  let el = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    acc += el * SETTINGS.speeds[speedIdx];
    let n = 0;
    const s0 = performance.now();
    while (acc >= DT && n < 8) { step(DT); acc -= DT; n++; }
    if (n) tStep = tStep * 0.95 + (performance.now() - s0) / n * 0.05;
    if (n === 8) acc = 0;
    nestPulse = Math.max(0, nestPulse - el * 2.5);
  }
  render(now / 1000);
  frames++; fpsT += el; if (fpsT >= 1) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  if ((hudT += el) > 0.2) {
    hudT = 0; $('stored').textContent = stored;
    let o = 0; const nAct = released | 0;
    for (let i = 0; i < nAct; i++) if ((ax[i] - nest.x) ** 2 + (ay[i] - nest.y) ** 2 > 900) o++;
    $('out').textContent = o;
  }
  requestAnimationFrame(frame);
}

// ---------- input (mouse + touch via pointer events) ----------
let drawing = null, hover = null, hintGone = false;
function dismissHint() { if (!hintGone) { hintGone = true; $('hint').style.opacity = 0; } }
setTimeout(dismissHint, 9000);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId); dismissHint();
  drawing = { id: e.pointerId, x: e.clientX, y: e.clientY };
  paintCircle(tool, e.clientX, e.clientY, SETTINGS.brushSizes[brushIdx]);
});
cv.addEventListener('pointermove', e => {
  hover = e.pointerType === 'mouse' ? { x: e.clientX, y: e.clientY } : null;
  if (!drawing || drawing.id !== e.pointerId) return;
  paintStroke(tool, drawing.x, drawing.y, e.clientX, e.clientY, SETTINGS.brushSizes[brushIdx]);
  drawing.x = e.clientX; drawing.y = e.clientY;
});
const stop = e => { if (drawing && drawing.id === e.pointerId) drawing = null; };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function setTool(t) { tool = t; document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); }
// buttons fire on pointerup (instant and reliable on touch); click only handles keyboard activation
function onPress(el, fn) {
  el.addEventListener('pointerup', e => { if (e.button === 0) fn(); });
  el.addEventListener('click', e => { if (e.detail === 0) fn(); });
}
document.querySelectorAll('[data-tool]').forEach(b => onPress(b, () => setTool(b.dataset.tool)));
const BRUSH_NAMES = ['Small', 'Medium', 'Large'];
function cycleBrush() { brushIdx = (brushIdx + 1) % 3; $('brushLbl').textContent = BRUSH_NAMES[brushIdx]; }
function cycleSpeed() { speedIdx = (speedIdx + 1) % SETTINGS.speeds.length; $('speedLbl').textContent = SETTINGS.speeds[speedIdx] + '×'; }
function togglePause() { paused = !paused; $('pauseIc').innerHTML = paused ? ICON_PLAY : ICON_PAUSE; $('pauseLbl').textContent = paused ? 'Play' : 'Pause'; }
const ICON_PLAY = '<svg viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="#d9c1a0"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 20 20"><rect x="5" y="4" width="3.2" height="12" rx="1" fill="#d9c1a0"/><rect x="11.8" y="4" width="3.2" height="12" rx="1" fill="#d9c1a0"/></svg>';
onPress($('brush'), cycleBrush); onPress($('speed'), cycleSpeed); onPress($('pause'), togglePause);
onPress($('reset'), () => setup(true));
addEventListener('keydown', e => {
  if (e.key === '1') setTool('food'); else if (e.key === '2') setTool('wall'); else if (e.key === '3') setTool('erase');
  else if (e.key === 'b' || e.key === 'B') cycleBrush(); else if (e.key === 'f' || e.key === 'F') cycleSpeed();
  else if (e.key === ' ') { e.preventDefault(); togglePause(); } else if (e.key === 'r' || e.key === 'R') setup(true);
});
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (innerWidth !== W || innerHeight !== H) setup(true); }, 200); });

// handle for automated play-tests
window.antSim = {
  state: () => {
    let carrying = 0, foodLeft = 0, walls = 0, trail = 0;
    for (let i = 0; i < N; i++) carrying += ac[i];
    for (let i = 0; i < food.length; i++) { foodLeft += food[i]; walls += wall[i]; trail += toFood[i] + toHome[i]; }
    return { ants: N, released: released | 0, stored, carrying, foodLeft, walls, trail: Math.round(trail), fps: Math.round(fps), stepMs: +tStep.toFixed(2), renderMs: +tRender.toFixed(2), tool, paused, speed: SETTINGS.speeds[speedIdx] };
  },
  antsInWalls: () => { let k = 0; for (let i = 0; i < (released | 0); i++) { const c = cellAt(ax[i], ay[i]); if (c >= 0 && wall[c]) k++; } return k; },
  nest,
};

setup(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
